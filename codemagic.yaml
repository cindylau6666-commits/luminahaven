workflows:
  ios-release:
    name: LuminaHaven iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: "hotmail.com.Y2luZH.cindylau9999"
        APP_STORE_CONNECT_ISSUER_ID: "9f90852b-806f-47fd-8dce-2f66fc923acf"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "LRZ3XGJ9Y9"
        APPLE_TEAM_ID: "P7L7NH2W5Z"
        APP_STORE_CONNECT_PRIVATE_KEY: |
          -----BEGIN PRIVATE KEY-----
          MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQgrR0Z/ywh6uI+sAey
          tNOI/pmHkrJUUTD05MELlPcihb2gCgYIKoZIzj0DAQehRANCAARc6B3nu2e9qerZ
          CnQ49Gdmcz7cUd3Z+XIcSeTs1LMmb0Kk0ej7Rzp4CJO7Icbx5IBdxioaoaWMx+Hf
          vUS3OcGe
          -----END PRIVATE KEY-----
      node: latest
      xcode: latest
    scripts:
      - name: Initialize Capacitor iOS project
        script: |
          set -e
          mkdir -p www
          cp index.html www/index.html
          cat << 'EOF' > package.json
          {
            "name": "luminahaven",
            "version": "1.0.0",
            "private": true
          }
          EOF
          cat << EOF > capacitor.config.json
          {
            "appId": "$BUNDLE_ID",
            "appName": "LuminaHaven",
            "webDir": "www"
          }
          EOF
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap add ios
          npx cap copy ios
      - name: Set up code signing and build IPA
        script: |
          set -e
          keychain initialize

          if [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "ERROR: APP_STORE_CONNECT_PRIVATE_KEY is empty!"
            exit 1
          fi

          RAW_KEY=$(printf "%s" "$APP_STORE_CONNECT_PRIVATE_KEY" | tr -d '\r')
          echo "Private key length: ${#RAW_KEY}"

          if [ "${#RAW_KEY}" -lt 150 ]; then
            echo "ERROR: Private key looks truncated (length=${#RAW_KEY})."
            exit 1
          fi

          BODY=$(printf "%s" "$RAW_KEY" \
            | sed -e 's/-----BEGIN PRIVATE KEY-----//g' \
                  -e 's/-----END PRIVATE KEY-----//g' \
                  -e 's/在这里粘贴完整 .p8 内容.*//g' \
                  -e 's/每行前面留两个空格.*//g' \
            | tr -d '[:space:]')

          {
            printf -- "-----BEGIN PRIVATE KEY-----\n"
            printf "%s" "$BODY" | fold -w 64
            printf -- "\n-----END PRIVATE KEY-----\n"
          } > /tmp/auth_key.p8
          chmod 600 /tmp/auth_key.p8

          openssl pkcs8 -topk8 -nocrypt -in /tmp/auth_key.p8 -out /tmp/auth_key_clean.p8 2>&1 || {
            echo "ERROR: openssl pkcs8 rejected /tmp/auth_key.p8"
            exit 1
          }
          chmod 600 /tmp/auth_key_clean.p8

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp /tmp/auth_key_clean.p8 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"

          mkdir -p build/ios/archive build/ios/ipa

          xcodebuild -project "ios/App/App.xcodeproj" \
            -scheme "App" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "build/ios/archive/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "/tmp/auth_key_clean.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE="Automatic" \
            CODE_SIGN_IDENTITY="Apple Distribution"

          cat << EOF > /tmp/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "build/ios/archive/App.xcarchive" \
            -exportOptionsPlist "/tmp/ExportOptions.plist" \
            -exportPath "build/ios/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "/tmp/auth_key_clean.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
