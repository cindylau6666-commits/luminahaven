workflows:
  ios-release:
    name: LuminaHaven iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: "hotmail.com.Y2luZH.cindylau9999"
        APP_STORE_CONNECT_ISSUER_ID: "69a6de8b-8081-47f3-93ce-2f606c923acd"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "LRZ3XGJ9Y9"
        APPLE_TEAM_ID: "P7L7NH2W5Z"
      groups:
        - app_store_credentials
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Initialize Capacitor iOS project
        script: |
          mkdir -p www
          cp index.html www/index.html
          cat << 'EOF' > package.json
          {
            "name": "luminahaven",
            "version": "1.0.0",
            "private": true
          }
          EOF
          cat << EOF > capacitor.config.json
          {
            "appId": "$BUNDLE_ID",
            "appName": "LuminaHaven",
            "webDir": "www"
          }
          EOF
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap add ios
          npx cap sync ios
      - name: Set up code signing and App Store Connect
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles --project "ios/App/App.xcodeproj" || true
      - name: Build IPA for App Store
        script: |
          PROFILE_PATH=$(ls -t ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision /Users/builder/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -n 1 || true)
          if [ -n "$PROFILE_PATH" ]; then
            PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null | plutil -extract Name raw - 2>/dev/null || true)
          fi
          if [ -n "$PROFILE_NAME" ]; then
            echo "Using provisioning profile: $PROFILE_NAME"
            XCARGS="DEVELOPMENT_TEAM=$APPLE_TEAM_ID CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER=\"$PROFILE_NAME\""
          else
            echo "Using team signing: $APPLE_TEAM_ID"
            XCARGS="DEVELOPMENT_TEAM=$APPLE_TEAM_ID"
          fi
          if [ -d "ios/App/App.xcworkspace" ]; then
            xcode-project build-ipa \
              --workspace "ios/App/App.xcworkspace" \
              --scheme "App" \
              --archive-xcargs "$XCARGS"
          else
            xcode-project build-ipa \
              --project "ios/App/App.xcodeproj" \
              --scheme "App" \
              --archive-xcargs "$XCARGS"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
