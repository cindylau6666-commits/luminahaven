workflows:
  ios-release:
    name: LuminaHaven iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: "hotmail.com.Y2luZH.cindylau9999"
        APP_STORE_CONNECT_ISSUER_ID: "69a6de8b-8081-47f3-93ce-2f606c923acd"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "LRZ3XGJ9Y9"
        APPLE_TEAM_ID: "P7L7NH2W5Z"
      groups:
        - app_store_credentials
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Initialize Capacitor iOS project
        script: |
          mkdir -p www
          cp index.html www/index.html
          cat << 'EOF' > package.json
          {
            "name": "luminahaven",
            "version": "1.0.0",
            "private": true
          }
          EOF
          cat << EOF > capacitor.config.json
          {
            "appId": "$BUNDLE_ID",
            "appName": "LuminaHaven",
            "webDir": "www"
          }
          EOF
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap add ios
          npx cap sync ios
      - name: Set up code signing and App Store Connect
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles --project "ios/App/App.xcodeproj" --custom-export-options='{"method":"app-store","signingStyle":"manual"}'
      - name: Build IPA for App Store
        script: |
          WORKSPACE_PATH=$(find ios -maxdepth 3 -name "*.xcworkspace" | head -n 1)
          PROJECT_PATH=$(find ios -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          if [ -n "$WORKSPACE_PATH" ]; then
            echo "Building workspace: $WORKSPACE_PATH"
            xcode-project build-ipa \
              --workspace "$WORKSPACE_PATH" \
              --scheme "App"
          else
            echo "Building project: $PROJECT_PATH"
            xcode-project build-ipa \
              --project "$PROJECT_PATH" \
              --scheme "App"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
